# Fork-only: runs the OVERLORD-30 behaviour script for the MailChannels Mailer bridge.
# Not part of the upstream pull request.
name: MailChannels bridge e2e

on:
  push:
    branches: ['agent/overlord-30/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: sodium, intl, mbstring, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          sudo apt-get install -y -qq python3-jsonschema
          # The Runtime path repository cannot guess its version on an agent branch
          jq '(.repositories[] | select(.url == "src/Symfony/Component/Runtime")) += {"options": {"versions": {"symfony/runtime": "8.2.x-dev"}}}' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json
          COMPOSER_ROOT_VERSION=8.2.x-dev composer update --no-progress --no-interaction --ignore-platform-req=ext-*

      - name: Allow the stub to listen on port 443
        run: sudo setcap cap_net_bind_service=+ep "$(readlink -f "$(command -v python3)")"

      - name: Run the behaviour script
        run: .mailchannels-e2e/run-e2e.sh
